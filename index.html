<head>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        h1 {
            color: #333;
        }
        p {
            color: #666;
        }
        .BG{
            display: flex;
            justify-content: center;
            height: 100vh;
        }
        .mobile-screen {
                background-color: #f0f0f0;
                padding: 20px;
                border-radius: 10px;
                width: 600px;
                border: 1px solid #ccc;
                
            }
        .header {
            font-size: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: white;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            min-height: 50px;
        }
        .nominal {
            
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: white;
            margin-bottom: 100px;
            border: 1px solid #ccc;
            min-height: 100px;
        }
        .jenis-bangunan, .jumlah-lantai, .luas-bangunan {
            font-size: 20px;
            display: block;
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            min-height: 100px;
        }
        .opt-jenis-bangunan, .opt-jumlah-lantai, .opt-luas-bangunan {
            visibility: hidden;
            display: flex;
            flex-direction: column;
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);

            padding: 10px;
            background-color: #e0e0e0;
            border: 1px solid #ccc;
            border-radius: 5px;
            width: 400px;
            height: 700px;
        }
        .ojb1, .ojb2, .ojb3, .ojb4, .back-ojb, .back-ojl, .back-olb, 
        .ojl1, .ojl2, .ojl3, .ojl4, .olb1, .olb2, .olb3, .olb4, .olb5, .olb6
        {
            font-size: 20px;
            display: block;
            min-height: 100px;
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            background-color: #28A745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        
    </style>

</head>

    function hideAllOptions() {
        opt_jenis_bangunanDiv.style.visibility = 'hidden';

    function setJenisBangunan(jenis) {

    function setJumlahLantai(jumlah) {
